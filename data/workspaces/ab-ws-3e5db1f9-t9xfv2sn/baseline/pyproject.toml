[project]
name = "textkit"
version = "0.1.0"
description = "Tiny text utilities - sample benchmark repository for AgentBench Lab"
requires-python = ">=3.9"
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.pytest.ini_options]
testpaths = ["tests"]
